[package]
name = "ootle_gov_wallet"
description = "Ootle governance co-signing over the wallet daemon: proposing, signing requests, assembling and submitting"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ootle_gov_core = { workspace = true }

tari_engine_types = { workspace = true }
tari_ootle_common_types = { workspace = true }
tari_ootle_transaction = { workspace = true }
tari_ootle_wallet_sdk = { workspace = true }
tari_ootle_walletd_client = { workspace = true }
tari_template_lib_types = { workspace = true }

dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The wallet SDK pulls in OpenSSL (via webauthn-rs). Linux builds link the system library; macOS and Windows build
# it from source so neither needs an OpenSSL install.
[target.'cfg(not(target_os = "linux"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3.3.0"
ootle_byte_type = { workspace = true }
tari_crypto = "0.24.0"
