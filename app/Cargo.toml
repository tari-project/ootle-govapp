[package]
name = "ootle-gov-app"
description = "Desktop app for co-signing Ootle governance transactions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ootle-governance"
path = "src/main.rs"

[dependencies]
ootle_gov_core = { workspace = true }
ootle_gov_wallet = { workspace = true }

anyhow = { workspace = true }
dirs = { workspace = true }
ootle-network = { workspace = true, features = ["serde"] }
gpui-kit = { workspace = true }
keyring-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tari_template_lib_types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }
